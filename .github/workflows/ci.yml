name: CI

# Runs on every pull request into staging or main, and on every push to those
# branches after a merge. `ci-passed` at the bottom is the single check to mark as
# required in branch protection.
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Placeholders only. The unit suite mocks the Supabase client outright and the
  # end-to-end suite stubs the network in the browser, so no real project,
  # credentials or test data are needed to run CI.
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_ANON_KEY: test-anon-key
  VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Write coverage to the job summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Resolve the Playwright version
        id: playwright
        run: |
          VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore the browser cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system dependencies for the cached browser
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:e2e

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  edge-functions:
    name: Edge function checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Shared money and Connect helpers have no remote imports, so this check
      # is fast and cannot be broken by a registry being unavailable. Skip
      # `*.test.ts` — those import vitest, which Deno does not resolve here.
      - name: Type-check the shared booking rules
        run: deno check supabase/functions/_shared/{booking,complaints,http,connect,disputes,email,payouts,verification}.ts

      # The handlers import Stripe and Supabase over the network, so a failure
      # here can mean a registry outage rather than a real problem. Advisory only.
      - name: Type-check the function handlers
        continue-on-error: true
        run: deno check supabase/functions/*/index.ts

      # No credentials. Fails the pull request when a function directory and
      # supabase/config.toml have drifted apart.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check every edge function is ready to deploy
        run: node scripts/deploy-edge-functions.mjs --dry-run

  # Push to staging or main deploys the whole functions directory after the
  # checks above pass. Pull requests do not deploy. `_shared/` is bundled into
  # each function, so the script always ships the full set.
  deploy-edge-functions:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    needs: [lint, test, build, e2e, edge-functions]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Keep this pin equal to SUPABASE_CLI_VERSION in scripts/deploy-edge-functions.mjs.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Choose the Supabase project
        id: target
        env:
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            if [[ ! "${PRODUCTION_SUPABASE_PROJECT_REF}" =~ ^[a-z]{20}$ ]]; then
              echo "PRODUCTION_SUPABASE_PROJECT_REF must be set to 20 lowercase letters."
              exit 1
            fi
            echo "name=production" >> "$GITHUB_OUTPUT"
            echo "ref=${PRODUCTION_SUPABASE_PROJECT_REF}" >> "$GITHUB_OUTPUT"
          else
            ref="${STAGING_SUPABASE_PROJECT_REF:-hzgybclfvpuxkmytdoos}"
            if [[ ! "$ref" =~ ^[a-z]{20}$ ]]; then
              echo "STAGING_SUPABASE_PROJECT_REF must be 20 lowercase letters."
              exit 1
            fi
            echo "name=staging" >> "$GITHUB_OUTPUT"
            echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy all edge functions to ${{ steps.target.outputs.name }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ steps.target.outputs.ref }}
        run: node scripts/deploy-edge-functions.mjs

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, test, build, e2e, edge-functions, deploy-edge-functions]
    if: always()
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed. See the checks above."
          exit 1
      - run: echo "All CI jobs passed."
